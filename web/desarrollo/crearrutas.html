<script type="text/javascript" src="js/jquery-ui-1.8.16.custom.min.js"></script>
<script type="text/javascript">
	var retorno;
	$(function() {
		$("#copy-button").click(function() {
			window.clipboardData.setData('Text',$("#resultado").val());
		});
		$("#Nueva").click(function() {
			
			var ruta= prompt('Nombre de la ruta', '').toUpperCase();
			if(ruta==null || ruta=="")
				return;
			var horario= prompt('Ingrese su horario', '').toUpperCase();
			if(horario==null || horario=="")
				return;
			var transbordos= prompt('Permite Trasbordos', 'si');
			transbordos= transbordos=="si";
			$("#resultado").val('ruta= this.AddRuta("' + ruta +'", "' + horario +'", ' + transbordos +');');
			retorno= prompt('Nombre de la ruta de retorno', '');
			if(retorno && retorno!="") {
				retorno=retorno.toUpperCase();
				retorno='\nthis.AddRutaInvertida("'+ retorno + '", ruta, "' + horario + '");';
				$("#resultado").val($("#resultado").val() + retorno);
			} else { 
				retorno="";
			}
			if(window.clipboardData)
				window.clipboardData.setData('Text',$("#resultado").val() + "\r\n\r\n");
		});
		$("area")
			.css("cursor", "pointer")
			.click(function(){
				var actual=$("#resultado").val();
				if(actual=="") {
					$("#Nueva").click();
					actual=$("#resultado").val();
					if(actual=="")
						return false;
				}
				var nueva= 'ruta.AddEstacion("' + $(this).attr("alt") + '", '+ $(this).attr("target") + ');';
				if(actual.indexOf(nueva)!=-1)
					return false;
				actual= actual.replace(retorno,"");
				$("#resultado").val(actual + "\n" + nueva + retorno);
				$("#resultado").scrollTop(99999);
				if(window.clipboardData)
				window.clipboardData.setData('Text',$("#resultado").val() + "\r\n\r\n");
				return false;
			});
	});
</script>
