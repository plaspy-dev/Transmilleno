services:
  mysql:
    image: mysql:5.7.44
    container_name: prueba-transmilleno-mysql
    command: ["--general-log=ON", "--log-output=TABLE", "--sql-mode=", "--lower-case-table-names=1"]
    ports: ["127.0.0.1:33357:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: DEMO_LOCAL_ROOT
      MYSQL_DATABASE: transmilenio
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: DEMO_LOCAL_USER
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - socket:/var/run/mysqld
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      retries: 35
  php:
    build:
      context: .
      dockerfile: php.Dockerfile
    container_name: prueba-transmilleno-http
    depends_on:
      mysql:
        condition: service_healthy
    command: ["php", "-d", "short_open_tag=1", "-d", "display_errors=0", "-d", "mysql.default_socket=/var/run/mysqld/mysqld.sock", "-S", "0.0.0.0:8080", "-t", "/site"]
    ports: ["127.0.0.1:33907:8080"]
    volumes:
      - ../transmilenio/htdocs:/site:ro
      - socket:/var/run/mysqld:ro
volumes:
  socket:
